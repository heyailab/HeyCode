name: heycode_app
description: HeyCode 移动端 - AI 编程助手远程接管控制台
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # 路由
  go_router: ^14.2.0
  # 网络
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  # 本地存储
  shared_preferences: ^2.3.2
  # 字体
  google_fonts: ^6.2.1
  # 国际化/日期格式
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
